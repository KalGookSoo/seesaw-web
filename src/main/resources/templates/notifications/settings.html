<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout}"
      th:lang="${#locale.language}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>알림 설정</title>
</head>
<body>
<main layout:fragment="content" class="notification-page" data-notification-settings>
  <header class="notification-page__header">
    <div>
      <p class="notification-page__eyebrow">ACTIVITY · SETTINGS</p>
      <h1>알림 설정</h1>
      <p>알림을 받을 활동과 전달 채널을 선택합니다.</p>
    </div>
    <a class="notification-secondary-button" th:href="@{/notifications}">알림으로 돌아가기</a>
  </header>
  <section class="notification-page__section">
    <div class="notification-page__section-heading">
      <h2>수신 채널</h2>
      <span>서비스 내부 알림은 항상 유지됩니다.</span>
    </div>
    <div class="notification-preference-list">
      <article class="notification-preference" th:each="type : ${notificationTypes}" th:data-notification-preference="${type.name()}">
        <div class="notification-preference__copy">
          <p class="notification-preference__eyebrow" data-notification-type-label>활동</p>
          <h3 data-notification-type-title>알림</h3>
          <p>선택한 활동이 발생하면 원하는 채널로 알려드립니다.</p>
        </div>
        <div class="notification-preference__channels">
          <label class="notification-switch">
            <input type="checkbox" data-notification-channel="webPush">
            <span>브라우저 알림</span>
          </label>
          <label class="notification-switch">
            <input type="checkbox" data-notification-channel="email">
            <span>메일</span>
          </label>
          <p class="notification-preference__status" data-notification-preference-status role="status"></p>
        </div>
      </article>
    </div>
  </section>
</main>
</body>
</html>
